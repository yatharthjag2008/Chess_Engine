<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Analyse page tests</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/site.css"></head>
<body>
  <!-- End-to-end tests of the Analyse page (analyse.js) with the exported model; analyse_tests.js copies analyse.html in. -->
  <pre id="results">running</pre>
  <div id="page"></div>
  <script>window.__noAutoInit = true;</script>
  <script type="module" src="analyse_tests.js"></script>
  <script>   // run in real time by tests/test_site.py (scoring a real game takes a while): post the results back
    const watch = setInterval(() => {
      const text = document.getElementById("results").textContent;
      if (!text.includes("RESULT passed=")) return;
      clearInterval(watch);
      fetch("/__results", { method: "POST", body: text });
    }, 100);
  </script>
</body>
</html>
