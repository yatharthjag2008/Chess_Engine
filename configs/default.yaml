# Default configuration: laptop-friendly (sample mode ON, small model).
# Every setting lives here. Other config files only list what they change and are
# merged on top of this one (see src/chess_engine/config.py).
# Relative paths are relative to the project root.

paths:
  data_dir: data
  raw_dir: data/raw              # downloaded / streamed Lichess files
  processed_dir: data/processed  # filtered games and training shards
  checkpoints_dir: checkpoints
  reports_dir: reports           # plots and result tables (committed to git)

stockfish:
  # null = auto-detect (STOCKFISH_PATH env var, then PATH, then common install locations).
  # Prefer the STOCKFISH_PATH env var for machine-specific paths so this file stays portable.
  path: null
  threads: 1
  hash_mb: 128
  analysis_depth: 14             # fixed depth used for game review (step 14)
  startup_timeout_seconds: 10

data:
  lichess:
    # Monthly files: {base_url}/lichess_db_standard_rated_{month}.pgn.zst
    base_url: https://database.lichess.org/standard
    months: ["2026-10"]          # ~30 GB compressed each; sample mode only streams the start
    verify_checksum: true        # check full downloads against Lichess's sha256sums.txt

  time_control:
    # Lichess speed = base_seconds + 40 * increment_seconds:
    #   bullet < 180s <= blitz < 480s <= rapid < 1500s <= classical
    speeds: [blitz]

  filters:
    rated_only: true
    min_rating: 800              # both players must be at least this rating
    max_rating: null             # null = no upper limit
    min_plies: 20                # drop very short games (10 moves each)
    exclude_terminations: [Abandoned, Rules infraction, Unterminated]
    exclude_titles: [BOT]        # we model humans, so drop games involving bot accounts
    require_clocks: true         # every move must carry a [%clk] time (used as a feature in step 4)

  sample:
    enabled: true                # stop early so everything runs on a laptop
    max_games: 50000

  split:                         # split BY GAME so no game leaks across splits
    train: 0.90
    val: 0.05
    test: 0.05
    seed: 42

  dataset:                       # step 4: games -> training positions (NumPy shards)
    skip_first_plies: 0          # drop each game's first N plies (0 = keep openings; the bot plays them too)
    min_clock_seconds: 0         # drop positions where the mover has less time left (0 = keep all)
    shard_size: 200000           # positions per shard file (~30 MB)
    games_per_task: 500          # games sent to a worker process at a time
    workers: null                # encoding processes; null = CPU count - 1 (at most 8), 1 = no subprocesses

ratings:
  # Lower edges of each bucket; the last one is open-ended:
  # 800-999, 1000-1199, ..., 2000-2199, 2200+
  bucket_edges: [800, 1000, 1200, 1400, 1600, 1800, 2000, 2200]

model:                           # step 5: rating-conditioned policy network
  architecture: resnet           # residual CNN over the 8x8 board planes
  channels: 64                   # feature maps per square in the trunk
  residual_blocks: 6
  rating_embedding_dim: 32       # learned vector per rating bucket
  conditioning: film             # how rating/clock reach every block: add (shift) | film (scale + shift)
  condition_on_opponent: true    # also embed the opponent's rating bucket
  use_clock: true                # both players' time left + increment as extra inputs
  policy_head: conv              # conv (73 move types per square, few weights) | fc (dense layer)
  value_head: true               # also predict win/draw/loss for the mover (auxiliary target in step 6)

training:                        # step 6: config-driven training loop
  seed: 42
  device: auto                   # auto (cuda > mps > cpu) | cpu | cuda | mps
  threads: null                  # torch CPU threads; null = torch's default (4 is fastest on this laptop)
  batch_size: 256
  epochs: 3
  max_steps: null                # stop after this many optimizer steps (null = run every epoch)
  max_minutes: null              # stop after this much wall time, with a checkpoint (handy on Colab)

  # optimizer + learning-rate schedule
  optimizer: adamw               # adamw | sgd (momentum 0.9, Nesterov)
  learning_rate: 0.001           # peak learning rate, reached after warmup
  weight_decay: 0.0001           # on conv/linear weights only (not biases, norms or embeddings)
  lr_schedule: cosine            # constant | cosine | linear (decay to min_lr_fraction at the last step)
  warmup_steps: 500              # linear warmup from 0
  min_lr_fraction: 0.05          # final learning rate = learning_rate * this
  grad_clip_norm: 1.0            # clip the global gradient norm (null = no clipping)
  mixed_precision: auto          # auto (bf16/fp16 on GPU, off on CPU) | off | bf16 | fp16

  # loss
  value_loss_weight: 0.25        # weight of the win/draw/loss loss next to the move loss
  label_smoothing: 0.0           # smoothing over the legal moves only (0 = plain cross-entropy)
  bucket_balancing: weight       # none | weight (per-position loss weights) | sample (resample positions)
  balance_power: 0.5             # 0 = as in the data, 1 = every rating bucket counts equally

  # data
  in_memory: true                # load the whole training split (0.6 GB for the 50k sample) or stream shards
  max_train_shards: null         # use only the first N training shards (quick experiments)
  prefetch_batches: 4            # batches decoded ahead on a background thread (0 = no thread)

  # logging, validation, checkpoints
  log_every_steps: 100
  eval_every_steps: 2000         # validation pass every N steps (and at the end of every epoch)
  val_max_positions: 50000       # validate on the first N validation positions (null = all)
  checkpoint_every_steps: 1000
  keep_checkpoints: 3            # older step checkpoints are deleted (latest + best are always kept)

evaluation:                      # step 7: move-match accuracy, baselines, calibration
  split: test                    # held-out games (never used for training or model selection)
  max_positions: null            # null = the whole split (172k positions for the 50k-game sample)
  batch_size: 1024
  bootstrap_samples: 1000        # confidence intervals: resample whole games, not positions
  confidence: 0.95
  calibration_bins: 10
  cross_rating_positions: 40000  # positions re-scored at every rating bucket (8 forward passes each)
  stockfish_positions: 10000     # test positions given to Stockfish (0 = skip); ~1,000-4,000 per bucket
  stockfish_depth: 10
  seed: 0
