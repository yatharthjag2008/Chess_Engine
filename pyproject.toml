[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-engine"
version = "0.1.0"
description = "Human-like, rating-conditioned chess move prediction trained on Lichess games, plus training tools."
readme = "README.md"
requires-python = ">=3.11"
# Major versions are pinned (>=tested, <next major). 0.x packages are bounded below 1.0.
dependencies = [
    "chess>=1.11,<2",          # python-chess (published on PyPI as "chess")
    "torch>=2.4,<3",
    "numpy>=2.0,<3",
    "pandas>=3.0,<4,!=3.1.1",  # 3.1.1's testing DLL was blocked by Windows Smart App Control
    "pyarrow>=26,<27",         # pyarrow ships a new major roughly every quarter
    "zstandard>=0.22,<1",      # streaming .pgn.zst decompression
    "pyyaml>=6,<7",
    "pydantic>=2.7,<3",        # typed config validation (also used by FastAPI)
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
    "matplotlib>=3.8,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "stockfish: needs a real Stockfish binary (skipped automatically if it is not installed)",
]
