<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Review</title>
  <meta name="description" content="Step through a game with Stockfish's verdict on every move, an eval graph and a coach.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/review.css">
</head>
<body>
  <header class="topbar">
    <nav class="nav" aria-label="Pages"><a href="index.html">Play</a><a href="review.html" aria-current="page">Review</a></nav>
    <h1>Game review</h1>
    <p class="tagline">Every move judged by Stockfish, compared with what players of your rating and stronger players play.</p>
  </header>

  <main class="layout review-layout">
    <section class="board-column" aria-label="Board">
      <div class="player-row"><span class="player-name" id="top-name">Black</span></div>
      <div class="board-wrap"><div id="board" class="board" role="grid" aria-label="Chess board"></div></div>
      <div class="player-row"><span class="player-name" id="bottom-name">White</span></div>
      <div class="stepper" id="stepper" hidden>
        <button type="button" id="first" aria-label="First position">&#x23EE;</button>
        <button type="button" id="prev" aria-label="Previous move">&#x25C0;</button>
        <span id="ply-label" class="ply-label">Start</span>
        <button type="button" id="next" aria-label="Next move">&#x25B6;</button>
        <button type="button" id="last" aria-label="Last position">&#x23ED;</button>
        <button type="button" id="flip">Flip</button>
      </div>
      <div id="graph" class="graph" hidden></div>
      <p id="status" class="status" role="status" aria-live="polite">Choose a game to review.</p>
    </section>

    <aside class="side-column">
      <section class="panel" id="source-panel">
        <h2>Game</h2>
        <div class="segmented" role="tablist">
          <label><input type="radio" name="source" value="pgn" checked><span>Paste PGN</span></label>
          <label><input type="radio" name="source" value="lichess"><span>Lichess</span></label>
          <label><input type="radio" name="source" value="chess.com"><span>Chess.com</span></label>
        </div>
        <form id="source-form" autocomplete="off"></form>
        <div id="game-list" class="game-list" hidden></div>
      </section>

      <section class="panel" id="summary-panel" hidden></section>
      <section class="panel" id="detail-panel" hidden></section>
      <section class="panel" id="coach-panel" hidden></section>
      <section class="panel" id="moves-panel" hidden>
        <h2>Moves</h2>
        <ol id="move-list" class="move-list review-moves"></ol>
      </section>
    </aside>
  </main>

  <script type="module" src="js/review.js"></script>
</body>
</html>
